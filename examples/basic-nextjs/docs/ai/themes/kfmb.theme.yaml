# Client Brand Theme
# Generated from https://www.kuwaitflourmills.com/Home

client:
  name: "Kuwait Flour Mills & Bakeries"
  sourceUrl: "https://www.kuwaitflourmills.com/Home"
  extractedAt: "2026-10-04"
  extractedBy: "playwright-scraper"

colors:
  primary: "#09509D"
  primaryForeground: "#FFFFFF"
  secondary: "#FF8C00"
  secondaryForeground: "#FFFFFF"
  accent: "#FF8C00"
  accentForeground: "#FFFFFF"
  background: "#FFFFFF"
  foreground: "#333333"
  muted: "#F4EFE4"
  mutedForeground: "#333333"
  headerBackground: "#FFFFFF"
  headerForeground: "#09509D"
  footerBackground: "#09509D"
  footerForeground: "#FFFFFF"
  border: "#FF8C00"
  ring: "#09509D"
  extra:
    - name: "cream"
      value: "#F4EFE4"
      usage: "Welcome and news bands. Sampled from the screenshot; computed CSS did not expose this token."

typography:
  headingFamily: "Raleway"
  headingWeight: "700"
  bodyFamily: "Raleway"
  bodyWeight: "400"
  monoFamily: ""
  googleFontsUrl: "https://fonts.googleapis.com/css?family=El+Messiri|Raleway:300,400,700"
  scale:
    hero: "85px"
    h1: "39px"
    h2: "32px"
    h3: "24px"
    body: "14px"
    small: "12px"
  headingTransform: "uppercase"
  letterSpacing: "0.06em"
  lineHeight: "1.5"

spacing:
  density: "comfortable"
  sectionGap: "0"
  containerMaxWidth: "1200px"
  containerPadding: "24px"

shape:
  borderRadius: "0px"
  buttonRadius: "100px"
  cardRadius: "0px"
  imageRadius: "0px"
  shadowStyle: "none"
  borderStyle: "orange frame on news photos"

tone:
  overall: "National industrial brand. Blue and orange on cream, with large photography of Kuwait and food."
  colorMode: "light"
  contrast: "high"
  imagery: "Full-bleed landscape photography, product stills, and circular orange category icons."
  heroStyle: "full-bleed-image"
  cardStyle: "bordered"
  navStyle: "solid-bar"

tailwind:
  colors:
    brand:
      primary: "#09509D"
      secondary: "#FF8C00"
      accent: "#FF8C00"
  fontFamily:
    heading: ["Raleway", "sans-serif"]
    body: ["Raleway", "El Messiri", "sans-serif"]
  borderRadius:
    DEFAULT: "0px"
    button: "9999px"
    card: "0px"

cssVariables: |
  --background: #ffffff;
  --foreground: #333333;
  --primary: #09509d;
  --primary-foreground: #ffffff;
  --secondary: #ff8c00;
  --accent: #ff8c00;
  --muted: #f4efe4;
  --card: #ffffff;

extraction:
  confidence: "high"
  method: "playwright-scraper-plus-screenshot"
  notes:
    - "Computed CSS: link and footer blue rgb(9, 80, 157), button rgb(255, 140, 0), body rgb(51, 51, 51)."
    - "Headings are Raleway 700 uppercase. El Messiri is present for Arabic and is not applied on the English homepage."
    - "The circular logo sits on the boundary between the white header and the bridge photograph."
